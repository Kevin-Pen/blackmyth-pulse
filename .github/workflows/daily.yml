name: daily-collect

on:
  schedule:
    # 每日 23:30 UTC+8 = 15:30 UTC
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collectors
        run: python collect/run.py
      - name: Commit snapshot
        run: |
          git config user.name "blackmyth-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: daily snapshot $(TZ='Asia/Shanghai' date +%F)"
            git push
          fi
